[project]
name = "products-mcp"
version = "0.1.0"
description = "MCP server for product catalog tools with Azure Cosmos DB integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.4.0",
    "azure-cosmos>=4.8.0",
    "azure-identity>=1.19.0",
    "openai>=2.0.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test_client.py", "test_models.py"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Exclude deployment tests from default pytest run
# Run deployment tests explicitly with: pytest test_deployment.py
addopts = "--ignore=test_deployment.py"
