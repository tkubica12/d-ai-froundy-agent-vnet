#cloud-config
package_upgrade: true
package_reboot_if_required: false

packages:
  - openssh-server
  - curl
  - jq
  - git
  - unzip
  - ca-certificates
  - apt-transport-https
  - lsb-release
  - gnupg
  - python3
  - python3-pip
  - python3-venv
  - xauth
  - x11-apps
  - firefox

write_files:
  - path: /etc/ssh/sshd_config.d/99-bastion.conf
    content: |
      AllowTcpForwarding yes
      X11Forwarding no
      PermitTunnel no
      GatewayPorts no
    permissions: '0644'

runcmd:
  # Install Azure CLI
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  
  # Install GitHub CLI
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list
  - apt-get update && apt-get install -y gh
  
  # Install Terraform
  - curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
  - apt-get update && apt-get install -y terraform
  
  # Install uv (Python package manager)
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - echo 'export PATH="/root/.local/bin:$PATH"' >> /etc/profile.d/uv.sh
  - echo 'eval "$(uv generate-shell-completion bash)"' >> /etc/profile.d/uv.sh
  
  # Make uv available system-wide
  - ln -sf /root/.local/bin/uv /usr/local/bin/uv
  
  # Configure git for root user
  - git config --global user.email "tkubica12@gmail.com"
  - git config --global user.name "Tomas Kubica"
  
  # Configure git for azureuser
  - sudo -u azureuser git config --global user.email "tkubica12@gmail.com"
  - sudo -u azureuser git config --global user.name "Tomas Kubica"
  
  # Restart SSH to apply config changes
  - systemctl restart sshd
  
  # Set JQ colors for better Azure CLI output
  - echo 'export JQ_COLORS="0;90:0;37:0;37:0;37:0;32:1;37:1;37"' >> /etc/profile.d/azure-cli.sh

final_message: "Jump host provisioning complete. SSH access via Azure Bastion is ready."
